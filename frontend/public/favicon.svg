<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="48" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1a9e52"/>
      <stop offset="100%" stop-color="#38c068"/>
    </linearGradient>
    <linearGradient id="domeGrad" x1="24" y1="13" x2="24" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E6F7EE"/>
    </linearGradient>
  </defs>

  <!-- Rounded square background (green gradient) -->
  <rect width="48" height="48" rx="11" fill="url(#bg)"/>

  <!-- Steam wavy lines -->
  <path d="M17 12 Q16 10 17 8 Q18 6 17 4.5"
        stroke="white" stroke-width="1.6" fill="none"
        stroke-linecap="round" opacity="0.75"/>
  <path d="M24 12 Q23 10 24 8 Q25 6 24 4.5"
        stroke="white" stroke-width="1.6" fill="none"
        stroke-linecap="round" opacity="0.75"/>
  <path d="M31 12 Q30 10 31 8 Q32 6 31 4.5"
        stroke="white" stroke-width="1.6" fill="none"
        stroke-linecap="round" opacity="0.75"/>

  <!-- Cloche / dome body -->
  <path d="M8.5 30.5 C8.5 19 15.5 13 24 13 C32.5 13 39.5 19 39.5 30.5 Z"
        fill="url(#domeGrad)"/>

  <!-- Dome handle knob -->
  <circle cx="24" cy="13" r="3.2" fill="#1a9e52"/>
  <circle cx="24" cy="12.8" r="1.5" fill="white" opacity="0.85"/>

  <!-- Plate base -->
  <rect x="8" y="30" width="32" height="3.2" rx="1.6" fill="white"/>

  <!-- Tray / stand -->
  <rect x="12" y="33.2" width="24" height="2" rx="1" fill="white" opacity="0.6"/>
</svg>
